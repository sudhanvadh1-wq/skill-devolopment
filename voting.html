<!DOCTYPE html>
<html>
<head>
    <title>Voting Eligibility</title>
</head>
<body>

<h2>Voting Eligibility Checker</h2>

<label>Enter Name:</label>
<input type="text" id="name"><br><br>

<label>Enter Age:</label>
<input type="number" id="age"><br><br>

<label>Enter Nationality:</label>
<input type="text" id="nationality"><br><br>

<button onclick="checkEligibility()">Check</button>

<p id="result"></p>

<script>
function checkEligibility() {

    let name = document.getElementById("name").value;
    let age = Number(document.getElementById("age").value);
    let nationality = document.getElementById("nationality").value;

    if (nationality.toLowerCase() === "indian") {

        if (age >= 18) {
            document.getElementById("result").innerHTML =
                "Name: " + name + "<br>" +
                "Nationality: Indian<br>" +
                "Age: " + age + "<br>" +
                "You are eligible to vote.";
        } 
        else {
            document.getElementById("result").innerHTML =
                "Name: " + name + "<br>" +
                "Nationality: Indian<br>" +
                "Age: " + age + "<br>" +
                "You are not eligible to vote.";
        }

    } 
    else {
        document.getElementById("result").innerHTML =
            "No output: Person is not Indian.";
    }
}
</script>

</body>
</html>
